startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apiKey
    properties:
      apiKey:
        type: string
        description: Your ReplyNodes credential (claim it at https://replynodes.com/auth.md)
  commandFunction: |
    config => ({ command: 'npx', args: ['-y', '@replynodes/mcp'], env: { REPLYNODES_API_KEY: config.apiKey } })

deploy:
  type: remote
  url: https://mcp.replynodes.com/mcp
